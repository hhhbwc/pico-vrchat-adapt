# pico_xr_alias.conf -- read by /system/lib64/libopenxr_forwardloader.so (shim)
#
# The shim only rewrites a path that literally contains the "from" token and
# only prunes bindings of that one profile, so every other app and every Pico
# system component is unaffected.
#
# from=   profile TOKEN suggested by the app that Pico's runtime does not know
# to=     profile TOKEN the shim substitutes.  Profiles that exist in Pico's
#         runtime (libpxrruntime.so):
#           oculus/touch_controller        <- default, best component overlap
#           bytedance/pico4_controller     <- PICO 4 native profile
#           meta/touch_controller_quest_2
#           valve/index_controller
# map=    OLD=NEW  component prefix to rename, because the Steam Frame and the
#         Touch controller name some controls differently (view -> menu)
# debug=  1 also logs per-binding probe results
#
# Read once per process at library load; changing it needs a reboot.
from=valve/frame_controller_valve
to=bytedance/pico4_controller
map=/input/view=/input/menu
map=/input/bumper=/input/trigger
map=/user/hand/right/input/x=/user/hand/left/input/x
map=/user/hand/right/input/y=/user/hand/left/input/y
forceext=1
discover=0
debug=1
